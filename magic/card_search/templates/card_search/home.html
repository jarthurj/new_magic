{% extends "./base.html" %}

{% block title %}
{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center">
<form method="GET" action="{% url 'results' %}" class="mx-auto max-w-3xl space-y-4 w-full">
    {% csrf_token %}
    <!-- Search Bar -->
    <input
        type="text"
        name="q"
        placeholder="Search for a card..."
        class="w-full rounded-xl border border-gray-300 bg-white px-5 py-3 text-lg
               shadow-sm transition
               focus:border-blue-500 focus:ring-2 focus:ring-blue-200
               outline-none"
    >

    <!-- Buttons -->
    <div class="flex gap-4">

        <button
            type="submit"
            class="flex-1 rounded-xl bg-blue-600 px-6 py-3 font-semibold text-white
                   shadow-md transition hover:bg-blue-700 active:scale-95"
        >
            Search
        </button>

        <a
            href="{% url 'search' %}"
            class="flex-1 rounded-xl border border-gray-300 bg-white px-6 py-3
                   text-center font-semibold text-gray-700 shadow-md
                   transition hover:bg-gray-100 active:scale-95"
        >
            Advanced Search
        </a>

    </div>
</div>
</form>


{% endblock %}
