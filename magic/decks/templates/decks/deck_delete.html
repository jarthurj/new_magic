<!-- decks/deck_confirm_delete.html -->
{% extends "base.html" %}

{% block title %}Delete Deck - {{ object.name }}{% endblock %}

{% block content %}

<div class="mx-auto max-w-2xl px-6 py-10">
    <div class="rounded-2xl bg-white p-8 shadow-xl">
        
        <h1 class="text-3xl font-bold text-red-600 mb-4">
            Delete Deck?
        </h1>
        
        <p class="text-gray-700 mb-6">
            Are you sure you want to delete <strong>{{ object.name }}</strong>?
        </p>
        
        <p class="text-gray-500 mb-6">
            This deck contains {{ object.card.count }} cards and cannot be undone.
        </p>
        
        <!-- Cancel Button -->
        <div class="flex gap-3">
            <a 
                href="{% url 'decks:detail' pk=object.pk %}"
                class="bg-gray-600 text-white font-semibold py-2 px-6 rounded-lg hover:bg-gray-700 transition"
            >
                Cancel
            </a>
            
            <!-- Delete Button -->
            <form method="POST" class="inline">
                {% csrf_token %}
                <button 
                    type="submit"
                    class="bg-red-600 text-white font-semibold py-2 px-6 rounded-lg hover:bg-red-700 transition"
                >
                    Delete Deck
                </button>
            </form>
        </div>
        
    </div>
</div>

{% endblock %}
